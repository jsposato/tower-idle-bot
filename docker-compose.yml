# redroid Android 11 container the bot drives over ADB.
#
# Written for an x86_64 Linux host with a GPU. redroid needs the Linux binder
# kernel modules, so this does NOT run under Docker Desktop on macOS — use a
# Linux VM (Colima/Lima) or a remote Linux host and `adb connect` to it.
# See README.md "Setting up the container" for what to change per host.
services:
  redroid:
    # Built locally by redroid-script: `python redroid.py -a 11.0.0 -gmnw`
    image: redroid/redroid:11.0.0_gapps_ndk_magisk_widevine
    stdin_open: true
    tty: true
    privileged: true
    ports:
      # Loopback only. Tunnel over SSH if the container runs on another host.
      - 127.0.0.1:5555:5555
    volumes:
      - ./redroid-11-data:/data
    command:
      # Screen geometry. Every tap coordinate in the Java code assumes 720x1280.
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=120
      # HOST-SPECIFIC: `host` needs /dev/dri on the host. Use `guest`
      # (software rendering) inside a VM or on a headless server.
      - androidboot.redroid_gpu_mode=host
      - androidboot.use_memfd=true
      # HOST-SPECIFIC (x86_64 only): libndk_translation lets ARM-only APKs run
      # on an x86_64 container. Remove this whole block on an ARM64 host and
      # build the image without redroid-script's `-n` flag.
      - ro.product.cpu.abilist0=x86_64,arm64-v8a,x86,armeabi-v7a,armeabi
      - ro.product.cpu.abilist64=x86_64,arm64-v8a
      - ro.product.cpu.abilist32=x86,armeabi-v7a,armeabi
      - ro.dalvik.vm.isa.arm=x86
      - ro.dalvik.vm.isa.arm64=x86_64
      - ro.enable.native.bridge.exec=1
      - ro.dalvik.vm.native.bridge=libndk_translation.so
      - ro.ndk_translation.version=0.2.2
