plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.ttd'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.google.com/")
    }
}

dependencies {
    // Database
//	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//	implementation 'org.postgresql:postgresql:42.7.5'
//	implementation 'org.testcontainers:postgresql:1.20.0'
//	implementation "org.liquibase:liquibase-core:4.31.1"
//	implementation 'org.hibernate:hibernate-core:6.6.13.Final'

    // Android
    implementation 'com.android.tools.ddms:ddmlib:31.13.0'
    implementation 'io.appium:java-client:10.0.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.35.0'

    // Image recognition
    implementation 'net.sourceforge.tess4j:tess4j:5.5.0'
    implementation 'org.openpnp:opencv:4.9.0-0'

    // Misc
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
