spring.application.name=ttb
server.port=9876

# Machine-specific settings. Override any of these with the matching
# environment variable (TTB_DEVICE_ID, TTB_ANDROID_HOME, TTB_APPIUM_JS_PATH)
# or a -Dttb.*= system property; see README.md "Setting up the controller".

# ADB serial of the redroid container (docker-compose.yml publishes 5555).
ttb.device-id=localhost:5555

# Android SDK root handed to Appium. Falls back to $ANDROID_HOME.
ttb.android-home=${ANDROID_HOME:}

# Appium's build/lib/main.js. Leave blank to let the Appium Java client find
# it via $APPIUM_PATH or `npm root -g`.
ttb.appium-js-path=
